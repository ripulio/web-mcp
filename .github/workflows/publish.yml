name: Publish new release

on:
  push:
    branches:
      - main
permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    if: github.repository == 'ripulio/web-mcp'
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: true
      - name: Install latest npm
        run: npm i -g npm@latest
      - name: install
        run: npm ci --ignore-scripts
      - name: build
        run: npm run build
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          version: node --run release:version
          publish: node --run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Get extension version
        if: steps.changesets.outputs.published
        id: extension-version
        env:
          PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          VERSION=$(echo "$PACKAGES" | jq -r '.[] | select(.name == "@ripulio/web-mcp-extension") | .version')
          if [ -n "$VERSION" ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload extension zip to release
        if: steps.extension-version.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/web-mcp-extension
          zip -r ../../webmcp-extension.zip extension
          gh release upload "@ripulio/web-mcp-extension@${{ steps.extension-version.outputs.version }}" ../../webmcp-extension.zip --clobber
